<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Imovio: CRM imobiliário com contactos, imóveis, pipeline e tarefas.">
  <meta name="theme-color" content="#121212">

  <!-- App no ecrã principal (iPhone e Android) -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Imovio">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Imovio</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; height: 100%; background: #121212; }
    /* Ecrã de arranque enquanto o Flutter carrega */
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      font-family: Poppins, system-ui, sans-serif; color: #fff;
    }
    #splash img { width: 72px; height: 72px; border-radius: 16px; }
    #splash .bar { width: 120px; height: 3px; background: #282828; border-radius: 3px; overflow: hidden; }
    #splash .bar::after {
      content: ""; display: block; width: 40%; height: 100%; background: #c5a059;
      animation: load 1.1s ease-in-out infinite;
    }
    @keyframes load { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  </style>
</head>
<body>
  <div id="splash">
    <img src="icons/Icon-192.png" alt="">
    <div class="bar"></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (s) s.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
